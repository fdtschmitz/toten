<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Pesquisa de Satisfação</title>
    <style>
        body { 
            font-family: 'Comic Sans MS', sans-serif; 
            text-align: center; 
            background-color: #f0f8ff; 
            margin: 0; 
            padding: 20px;
            padding-bottom: 80px; /* Espaço para a barra de progresso não sobrepor nada */
            touch-action: manipulation; 
            user-select: none; 
        }
        
        h1 { color: #333; margin-top: 3%; font-size: 2.5em; }
        
        .question { display: none; margin-top: 5%; font-size: 2em; }
        .active { display: block; }
        
        .options-container { 
            display: flex; 
            justify-content: center; 
            flex-wrap: wrap; 
            gap: 20px; 
            margin-top: 30px; 
        }
        
        .emoji-btn { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 200px; 
            height: 200px; 
            border: none; 
            background: white; 
            border-radius: 30px; 
            box-shadow: 0 6px 10px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        
        .emoji-btn:active { transform: scale(0.9); background: #e0f0ff; }
        
        .emoji { font-size: 5em; }
        .label { font-size: 0.35em; font-weight: bold; margin-top: 15px; color: #555; }
        
        #q6 .emoji-btn { width: 140px; height: 140px; border-radius: 20px; }
        #q6 .emoji { font-size: 3.5em; }
        #q6 .label { font-size: 0.4em; }
        
        #thank-you { display: none; margin-top: 25%; font-size: 4em; color: #4CAF50; }

        /* Estilos da Barra de Progresso */
        #progress-bar {
            position: fixed;
            bottom: 40px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .dot {
            width: 25px;
            height: 25px;
            background-color: #dcdcdc;
            border-radius: 50%;
            transition: background-color 0.4s, transform 0.4s;
        }

        .dot.active-dot {
            background-color: #4CAF50;
            transform: scale(1.4);
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .dot.completed-dot {
            background-color: #8bc34a;
        }

        article {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 5px;
            float: left;
            box-sizing: border-box;
        }

        article div {
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 140px; 
            height: 140px; 
            border: none; 
            background: white; 
            border-radius: 30px; 
            box-shadow: 0 6px 10px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: transform 0.2s; 
        }

        article input {
            position: absolute;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            opacity: 0;
            cursor: pointer;
        }

        input[type=checkbox]:checked ~ div {
            background-color: #50bcf2;
        }
        /* Estilo das opções de múltipla escolha */
        .option1 {
            cursor: pointer;
            margin: 10px;
        }

        .option1 input[type="checkbox"] {
            display: none; /* Esconde a caixinha padrão do checkbox */
        }
        .checkbox-content {
            display: inline-block;
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 15px;
            transition: transform 0.2s, background-color 0.2s;
        }

        /* Quando o checkbox estiver marcado, muda a cor de fundo do item */
        .option1 input[type="checkbox"]:checked + .checkbox-content {
            background-color: #ffeaa7; /* Um amarelo suave indicando seleção */
            transform: scale(0.95);
            border: 3px solid #f39c12;
        }

        /* Botão de finalizar pesquisa */
        .submit-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5em;
            font-family: 'Comic Sans MS', sans-serif;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 6px 10px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .submit-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h1>Conta pra gente: como foi seu almoço?</h1>

    <div id="survey-container">
        
        <!-- Pergunta 1 -->
        <div class="question active" id="q1">
            <p>1. O almoço estava gostoso?</p>
            <div class="options-container">
                <button class="emoji-btn" onclick="nextQuestion(1, 'gostei')"><span class="emoji">🙂</span><span class="label">Gostei</span></button>
                <button class="emoji-btn" onclick="nextQuestion(1, 'nao_gostei')"><span class="emoji">😡</span><span class="label">Não gostei</span></button>
            </div>
        </div>

        <!-- Pergunta 2 -->
        <div class="question" id="q2">
            <p>2. A comida estava em uma temperatura boa para você?</p>
            <div class="options-container">
                <button class="emoji-btn" onclick="nextQuestion(2, 'gostei')"><span class="emoji">🙂</span><span class="label">Gostei</span></button>
                <button class="emoji-btn" onclick="nextQuestion(2, 'nao_gostei')"><span class="emoji">😡</span><span class="label">Não gostei</span></button>
            </div>
        </div>

        <!-- Pergunta 3 -->
        <div class="question" id="q3">
            <p>3. Você gostou da carne hoje?</p>
            <div class="options-container">
                <button class="emoji-btn" onclick="nextQuestion(3, 'gostei')"><span class="emoji">🙂</span><span class="label">Gostei</span></button>
                <button class="emoji-btn" onclick="nextQuestion(3, 'nao_gostei')"><span class="emoji">😡</span><span class="label">Não gostei</span></button>
            </div>
        </div>

        <!-- Pergunta 4 -->
        <div class="question" id="q4">
            <p>4. Quanto você conseguiu comer?</p>
            <div class="options-container">
                <button class="emoji-btn" onclick="nextQuestion(4, 'comi_tudo')"><span class="emoji">🥰</span><span class="label">Comi tudo</span></button>
                <button class="emoji-btn" onclick="nextQuestion(4, 'comi_pouco')"><span class="emoji">🙁</span><span class="label">Comi pouco</span></button>
                <button class="emoji-btn" onclick="nextQuestion(4, 'nao_comi')"><span class="emoji">😣</span><span class="label">Não comi</span></button>
            </div>
        </div>

        <!-- Pergunta 5 -->
        <div class="question" id="q5">
            <p>5. E as comidas de hoje, como foram para você?</p>
            <div class="options-container">
                <button class="emoji-btn" onclick="nextQuestion(5, 'gostei_de_todas')"><span class="emoji">🙂</span><span class="label">Gostei de todas</span></button>
                <button class="emoji-btn" onclick="nextQuestion(5, 'nao_gostei_alguma')"><span class="emoji">😡</span><span class="label">Não gostei de alguma</span></button>
            </div>
        </div>

        <!-- Pergunta 6 -->
        <div class="question" id="q6">
            <p>6. Você quer nos dizer o que não gostou?</p>
            <div class="options-container">
                <!-- O uso do <label> permite que tocar no emoji ou no texto marque o checkbox -->
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="arroz">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🍚</span><br><span style="font-size: 0.6em;">Arroz</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="carne">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🥩</span><br><span style="font-size: 0.6em;">Carne</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="frango">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🍗</span><br><span style="font-size: 0.6em;">Frango</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="peixe">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🐟</span><br><span style="font-size: 0.6em;">Peixe</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="feijao">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🫘</span><br><span style="font-size: 0.6em;">Feijão</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="salada">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🥗</span><br><span style="font-size: 0.6em;">Salada</span></div>
                </label>
                
                <label class="option1">
                    <input type="checkbox" class="q6-checkbox" value="macarrao">
                    <div class="checkbox-content"><span style="font-size: 2.5em;">🍝</span><br><span style="font-size: 0.6em;">Macarrão</span></div>
                </label>
            </div>
            
            <!-- Botão grande para finalizar a etapa -->
            <button type="button" class="submit-btn" onclick="coletarEscolhasQ6()">Finalizar Pesquisa</button>
        </div>
        
    </div>

    <!-- Indicador de Progresso (Timeline) -->
    <div id="progress-bar">
        <div class="dot active-dot" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
        <div class="dot" id="dot-4"></div>
        <div class="dot" id="dot-5"></div>
        <div class="dot" id="dot-6"></div>
    </div>

    <div id="thank-you">
        <p>Obrigado! 🥰</p>
    </div>

    <script>
        let respostas = {};
        let multiplaEscolha = [false, false, false, false, false, false];
        // 0 - arroz ; 1 - carne ; 2 - frango ; 3 - peixe ; 4 - feijão ; 5 - salada ; 6 - macarrão

        function escolhas(opcao) {
            multiplaEscolha[opcao] = !multiplaEscolha[opcao]; // alterna entre True e False
        }
        

        function nextQuestion(currentQ, resposta) {
            respostas['q' + currentQ] = resposta;
            
            // Oculta a pergunta atual
            document.getElementById('q' + currentQ).classList.remove('active');
            
            // Atualiza a timeline: marca a atual como concluída
            let currentDot = document.getElementById('dot-' + currentQ);
            if (currentDot) {
                currentDot.classList.remove('active-dot');
                currentDot.classList.add('completed-dot');
            }
            
            // Lógica condicional da Pergunta 5
            if (currentQ === 5 && resposta === 'gostei_de_todas') {
                respostas['q6'] = 'nenhuma'; 
                enviarDados();
                return;
            }
            
            let nextQ = currentQ + 1;
            let nextElement = document.getElementById('q' + nextQ);
            
            if (nextElement) {
                // Mostra a próxima pergunta
                nextElement.classList.add('active');
                
                // Atualiza a timeline: marca a próxima como ativa
                let nextDot = document.getElementById('dot-' + nextQ);
                if (nextDot) {
                    nextDot.classList.add('active-dot');
                }
            } else {
                enviarDados();
            }
        }

        function coletarEscolhasQ6() {
            // Pega todos os checkboxes que pertencem à classe q6-checkbox E que estão marcados
            let checkboxes = document.querySelectorAll('.q6-checkbox:checked');
            let itensSelecionados = [];
            
            // Adiciona o valor (ex: 'arroz', 'carne') de cada checkbox marcado na lista
            checkboxes.forEach(function(checkbox) {
                itensSelecionados.push(checkbox.value);
            });
            
            // Junta a lista em um único texto separado por vírgulas. 
            // Exemplo: se marcar arroz e feijão, vira a string "arroz, feijao"
            let respostaFinal = itensSelecionados.length > 0 ? itensSelecionados.join(', ') : 'nada_marcado';
            
            // Envia a string consolidada para a função nextQuestion existente
            nextQuestion(6, respostaFinal);
        }

        function enviarDados() {
            document.querySelector('h1').style.display = 'none';
            document.getElementById('progress-bar').style.display = 'none'; // Esconde a timeline no final
            document.getElementById('thank-you').style.display = 'block';
            
            fetch('/api/salvar_pesquisa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(respostas)
            }).then(() => {
                setTimeout(() => { location.reload(); }, 2000);
            }).catch(error => {
                console.error("Erro ao salvar:", error);
                setTimeout(() => { location.reload(); }, 2000);
            });
        }
    </script>
</body>
</html>
