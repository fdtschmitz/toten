<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Totem Pesquisa">

    <!-- Ajusta o enquadramento de tela sem zoom e sem bordas (Safe Area) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Ícone que aparecerá na tela de início do iPad -->
    <link rel="apple-touch-icon" href="/static/img/logo.png">
    <title>Acesso Restrito - Totem</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f8ff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 6px 10px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h2 { color: #ec7803; font-weight: 800; margin-bottom: 20px; }
        input[type="password"] { width: 90%; padding: 15px; margin-bottom: 20px; border: 2px solid #dcdcdc; border-radius: 10px; font-size: 1.2em; text-align: center; font-family: 'Montserrat', sans-serif; }
        button { background-color: #69b42d; color: white; border: none; padding: 15px 40px; font-size: 1.2em; font-weight: 800; border-radius: 9999px; cursor: pointer; transition: transform 0.2s; font-family: 'Montserrat', sans-serif; }
        button:active { transform: scale(0.95); }
        .erro { color: #c0392b; font-weight: 500; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Acesso ao Totem</h2>
        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Senha de acesso" required autofocus>
            <br>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
